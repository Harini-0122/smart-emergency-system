
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Login | Smart Emergency</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f2f5fa;
            color: #172033;
        }

        .card {
            width: 100%;
            max-width: 440px;
            padding: 35px;
            border-radius: 16px;
            background: white;
            box-shadow: 0 10px 35px #102a4315;
        }

        h1 { color: #102a43; }

        label {
            display: block;
            margin: 18px 0 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccd5e0;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 24px;
            border: 0;
            border-radius: 8px;
            background: #e63946;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .message {
            padding: 12px;
            margin: 15px 0;
            border-radius: 8px;
            line-height: 1.5;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        .success {
            background: #d1fae5;
            color: #065f46;
        }

        a {
            color: #1769aa;
            text-decoration: none;
        }

        .links {
            text-align: center;
            margin-top: 20px;
            line-height: 2;
        }
    </style>
</head>

<body>
<div class="card">
    <h1>👋 User Login</h1>
    <p>Sign in to report and track emergencies.</p>

    <div class="message error" th:if="${param.error}">
        Invalid email or password. Please try again.
    </div>

    <div class="message success"
         th:if="${registrationSuccess}"
         th:text="${registrationSuccess}">
        Registration successful! Please log in.
    </div>

    <form th:action="@{/login}" method="post">
        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">

        <label for="username">Gmail Address</label>
        <input id="username"
               type="email"
               name="username"
               placeholder="you@gmail.com"
               autocomplete="username"
               required>

        <label for="password">Password</label>
        <input id="password"
               type="password"
               name="password"
               placeholder="Enter your password"
               autocomplete="current-password"
               required>

        <button type="submit">Login</button>
    </form>

    <div class="links">
        Don't have an account?
        <a th:href="@{/register}">Register</a>
        <br>
        <a th:href="@{/}">Back to Home</a>
    </div>
</div>
</body>
</html>
