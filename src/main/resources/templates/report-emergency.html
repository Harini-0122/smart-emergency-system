
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Report Emergency | Smart Emergency</title>

    <!-- Leaflet map CSS -->
    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
            overflow-y: auto;
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;
            overflow-x: hidden;
            overflow-y: auto;
            font-family: Arial, Helvetica, sans-serif;
            background: #f1f5f9;
            color: #102a43;
            line-height: 1.6;
        }

        .page {
            width: 100%;
            max-width: 760px;
            margin: 40px auto;
            padding: 0 18px 35px;
        }

        .form-card {
            background: #ffffff;
            padding: 32px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(15, 23, 42, 0.07);
        }

        .back-link {
            display: inline-block;
            color: #2563eb;
            text-decoration: none;
            margin-bottom: 18px;
            font-weight: 600;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 32px;
            line-height: 1.3;
        }

        .subtitle {
            color: #64748b;
            margin: 0 0 25px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 13px;
            font-size: 15px;
            font-family: inherit;
            color: #1e293b;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            background: #ffffff;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        .message {
            padding: 12px 14px;
            border-radius: 8px;
            margin-bottom: 18px;
        }

        .error-message {
            background: #fee2e2;
            color: #991b1b;
        }

        .success-message {
            background: #dcfce7;
            color: #166534;
        }

        /* Location search */
        .location-search {
            position: relative;
        }

        .location-suggestions {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            z-index: 1000;
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            max-height: 220px;
            overflow-y: auto;
            box-shadow: 0 8px 20px rgba(15, 23, 42, 0.12);
        }

        .location-suggestions.show {
            display: block;
        }

        .location-option {
            display: block;
            width: 100%;
            padding: 12px;
            border: none;
            border-bottom: 1px solid #edf2f7;
            background: #ffffff;
            color: #243b53;
            text-align: left;
            font-size: 14px;
            line-height: 1.5;
            cursor: pointer;
        }

        .location-option:hover,
        .location-option:focus {
            background: #f1f5f9;
        }

        .map-help {
            color: #64748b;
            font-size: 13px;
            margin: 8px 0;
        }

        #searchMessage {
            margin-top: 10px;
        }

        #emergencyMap {
            height: 350px;
            width: 100%;
            margin-top: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            z-index: 1;
        }

        .submit-button {
            width: 100%;
            padding: 14px;
            background: #ef3948;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .submit-button:hover {
            background: #d92335;
        }

        footer {
            text-align: center;
            padding: 20px 12px;
            color: #64748b;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            .page {
                margin: 20px auto;
                padding: 0 12px 25px;
            }

            .form-card {
                padding: 22px 17px;
            }

            h1 {
                font-size: 27px;
            }

            #emergencyMap {
                height: 300px;
            }
        }
    </style>
</head>

<body>

<main class="page">

    <section class="form-card">

        <a th:href="@{/user/dashboard}" class="back-link">
            ← Back to Dashboard
        </a>

        <h1>Report an Emergency</h1>

        <p class="subtitle">
            Provide the details so your emergency can be recorded.
        </p>

        <div th:if="${errorMessage != null}"
             class="message error-message"
             th:text="${errorMessage}">
        </div>

        <div th:if="${successMessage != null}"
             class="message success-message"
             th:text="${successMessage}">
        </div>

        <form th:action="@{/user/report-emergency}" method="post">

            <!-- Spring Security CSRF protection -->
            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <!-- Emergency title -->
            <div class="form-group">
                <label for="title">Emergency Title</label>

                <input
                    type="text"
                    id="title"
                    name="title"
                    placeholder="e.g. Road accident"
                    maxlength="150"
                    required>
            </div>

            <!-- Emergency type -->
            <div class="form-group">
                <label for="emergencyType">Emergency Type</label>

                <select id="emergencyType"
                        name="emergencyType"
                        required>
                    <option value="">Select emergency type</option>
                    <option value="Accident">Road Accident</option>
                    <option value="Fire">Fire</option>
                    <option value="Medical">Medical Emergency</option>
                    <option value="Flood">Flood</option>
                    <option value="Crime">Crime</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <!-- Location input and search suggestions -->
            <div class="form-group">

                <label for="location">Location / Address</label>

                <div class="location-search">

                    <input
                        type="text"
                        id="location"
                        name="location"
                        placeholder="Type a place, address, or landmark..."
                        autocomplete="off"
                        maxlength="255"
                        required>

                    <div id="locationSuggestions"
                         class="location-suggestions"
                         role="listbox">
                    </div>

                </div>

                <p id="searchMessage" class="map-help">
                    Type at least 3 characters and select a suggestion,
                    or click on the map.
                </p>

                <!-- Interactive map -->
                <div id="emergencyMap"></div>

                <!-- Coordinates sent to the controller -->
                <input type="hidden"
                       id="latitude"
                       name="latitude">

                <input type="hidden"
                       id="longitude"
                       name="longitude">

                <p id="coordinates" class="map-help">
                    No location selected yet.
                </p>

            </div>

            <!-- Emergency description -->
            <div class="form-group">
                <label for="description">Description</label>

                <textarea
                    id="description"
                    name="description"
                    placeholder="Describe what happened"
                    maxlength="1000"
                    required></textarea>
            </div>

            <button type="submit" class="submit-button">
                Submit Emergency Report
            </button>

        </form>

    </section>

</main>

<footer>
    Smart Emergency Tracking and Response Management System
</footer>

<!-- Leaflet map JavaScript -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    // Default map view: Hyderabad, Telangana.
    // This is not the user's detected location.
    const map = L.map('emergencyMap')
        .setView([17.3850, 78.4867], 11);

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    const locationInput = document.getElementById('location');
    const latitudeInput = document.getElementById('latitude');
    const longitudeInput = document.getElementById('longitude');
    const coordinates = document.getElementById('coordinates');
    const suggestions = document.getElementById('locationSuggestions');
    const searchMessage = document.getElementById('searchMessage');

    let marker = null;
    let searchTimer = null;
    let requestNumber = 0;

    function clearSelectedCoordinates() {
        latitudeInput.value = '';
        longitudeInput.value = '';
        coordinates.textContent = 'No location selected yet.';

        if (marker) {
            map.removeLayer(marker);
            marker = null;
        }
    }

    function hideSuggestions() {
        suggestions.classList.remove('show');
        suggestions.replaceChildren();

        delete suggestions.dataset.firstLat;
        delete suggestions.dataset.firstLon;
        delete suggestions.dataset.firstName;
    }

    function updateMarker(lat, lng, zoom = 16) {
        lat = Number(lat);
        lng = Number(lng);

        latitudeInput.value = lat.toFixed(6);
        longitudeInput.value = lng.toFixed(6);

        coordinates.textContent =
            'Selected coordinates: ' +
            lat.toFixed(6) + ', ' + lng.toFixed(6);

        if (!marker) {
            marker = L.marker([lat, lng], {
                draggable: true
            }).addTo(map);

            marker.on('dragend', function () {
                const position = marker.getLatLng();

                latitudeInput.value = position.lat.toFixed(6);
                longitudeInput.value = position.lng.toFixed(6);

                coordinates.textContent =
                    'Selected coordinates: ' +
                    position.lat.toFixed(6) + ', ' +
                    position.lng.toFixed(6);
            });
        } else {
            marker.setLatLng([lat, lng]);
        }

        map.setView([lat, lng], zoom);
        marker.bindPopup('Selected emergency location').openPopup();
    }

    function chooseLocation(place) {
        locationInput.value = place.display_name;

        updateMarker(
            Number(place.lat),
            Number(place.lon),
            16
        );

        hideSuggestions();

        searchMessage.textContent =
            'Location selected. You can drag the marker to adjust it.';
    }

    async function searchLocation(query, currentRequest) {
        searchMessage.textContent = 'Searching for location...';

        try {
            const url =
                'https://nominatim.openstreetmap.org/search?format=jsonv2' +
                '&limit=5&countrycodes=in&q=' +
                encodeURIComponent(query);

            const response = await fetch(url);

            if (!response.ok) {
                throw new Error('Location search failed');
            }

            const places = await response.json();

            // Ignore results from previous searches
            if (currentRequest !== requestNumber) {
                return;
            }

            hideSuggestions();

            if (places.length === 0) {
                searchMessage.textContent =
                    'No matching places found. Try a nearby landmark or address.';
                return;
            }

            searchMessage.textContent =
                'Select the correct location from the suggestions.';

            places.forEach(function (place) {
                const option = document.createElement('button');

                option.type = 'button';
                option.className = 'location-option';
                option.setAttribute('role', 'option');
                option.textContent = place.display_name;

                option.addEventListener('click', function () {
                    chooseLocation(place);
                });

                suggestions.appendChild(option);
            });

            // Enter selects the first search result
            suggestions.dataset.firstLat = places[0].lat;
            suggestions.dataset.firstLon = places[0].lon;
            suggestions.dataset.firstName = places[0].display_name;

            suggestions.classList.add('show');

        } catch (error) {
            if (currentRequest !== requestNumber) {
                return;
            }

            hideSuggestions();

            searchMessage.textContent =
                'Location search failed. Check your internet connection, ' +
                'or select a location directly on the map.';
        }
    }

    // Search after the user pauses typing
    locationInput.addEventListener('input', function () {
        clearTimeout(searchTimer);

        const query = locationInput.value.trim();
        const currentRequest = ++requestNumber;

        hideSuggestions();
        clearSelectedCoordinates();

        if (query.length < 3) {
            searchMessage.textContent =
                'Type at least 3 characters to search.';
            return;
        }

        searchTimer = setTimeout(function () {
            searchLocation(query, currentRequest);
        }, 1000);
    });

    // Press Enter to select the first suggestion
    locationInput.addEventListener('keydown', function (event) {
        if (event.key === 'Enter' &&
            suggestions.classList.contains('show')) {

            const firstLat = suggestions.dataset.firstLat;
            const firstLon = suggestions.dataset.firstLon;
            const firstName = suggestions.dataset.firstName;

            if (firstLat && firstLon) {
                event.preventDefault();

                chooseLocation({
                    lat: firstLat,
                    lon: firstLon,
                    display_name: firstName
                });
            }
        }

        if (event.key === 'Escape') {
            hideSuggestions();
        }
    });

    // Close suggestions when clicking outside the search field
    document.addEventListener('click', function (event) {
        if (!event.target.closest('.location-search')) {
            hideSuggestions();
        }
    });

    // Clicking the map selects a new point
    map.on('click', function (event) {
        updateMarker(
            event.latlng.lat,
            event.latlng.lng,
            map.getZoom()
        );

        searchMessage.textContent =
            'Map location selected successfully.';
    });

    // Make sure Leaflet sizes correctly when the page loads
    window.addEventListener('load', function () {
        map.invalidateSize();
    });

    setTimeout(function () {
        map.invalidateSize();
    }, 200);
</script>

</body>
</html>
